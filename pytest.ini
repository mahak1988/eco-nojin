[pytest]
testpaths = apps/api/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
addopts = --ignore=.pnpm-store --ignore=node_modules --tb=short -q
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning:datetime
    ignore:.*utcnow.*:DeprecationWarning
    ignore:.*HTTP_.*:DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
