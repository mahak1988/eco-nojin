name: Admin Panel E2E (Playwright)

on:
  push:
    paths:
      - 'apps/admin_panel/frontend/**'
      - '.github/workflows/admin-panel-e2e.yml'
  pull_request:
    paths:
      - 'apps/admin_panel/frontend/**'
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin_panel/frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        continue-on-error: true

      - name: Install Playwright (optional)
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Typecheck / build admin frontend
        run: |
          npm run build --if-present
        continue-on-error: true

      - name: Run smoke tests
        run: |
          if [ -f playwright.config.ts ] || [ -f playwright.config.js ]; then
            npx playwright test e2e/admin-smoke.spec.ts --reporter=list
          else
            echo "Playwright not fully configured — smoke skeleton present at e2e/admin-smoke.spec.ts"
          fi
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin_panel/frontend/playwright-report
          retention-days: 7
        continue-on-error: true
