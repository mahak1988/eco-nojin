name: Security Bandit

on:
  push:
    branches: [main, develop, feature/free-science-stack]
  pull_request:
    branches: [main]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (medium+, apps/)
        run: |
          bandit -r apps/ -c bandit.yaml -ll -f txt -o bandit-report.txt || true
          bandit -r apps/ -c bandit.yaml -ll -f json -o bandit-report.json || true
          echo "## Bandit (medium+)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f bandit-report.txt ]; then
            tail -n 40 bandit-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Upload bandit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            bandit-report.txt
            bandit-report.json
          retention-days: 30
