name: Security Bandit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (medium+)
        run: bandit -r apps/ -ll --skip B101 -f txt || true
        # || true keeps signal without hard-fail until baseline stabilizes; raise gate in phase 7
