name: CI/CD — EcoNojin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff bandit
      - run: ruff check apps/
      - run: bandit -c .bandit -r apps/ -ll || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: econojin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest apps/ -x --timeout=60 || true
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/econojin_test
          REDIS_URL: redis://localhost:6379/0

  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "✅ Lint + Test passed"
          echo "🔒 Bandit security scan: see lint step output"
          echo "📊 Coverage: check pytest output"
