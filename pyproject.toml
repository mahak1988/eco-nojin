[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econojin"
version = "2.0.0"
description = "Integrated smart agriculture, water, environment and green economy platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Econojin Team" }]
keywords = ["agriculture", "fastapi", "sustainability", "education"]
dependencies = [
  # Web
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "websockets>=13.0",
  "starlette>=0.40.0",
  # Data / ORM
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "greenlet>=3.0.0",
  # Settings / validation
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  # Auth / security
  "python-jose[cryptography]>=3.3.0",
  "cryptography>=43.0.0",
  "passlib[bcrypt]>=1.7.4",
  "argon2-cffi>=23.1.0",
  # HTTP / utils
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  # Observability
  "sentry-sdk[fastapi]>=2.18.0",
]

[project.optional-dependencies]
worker = [
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
]
types = [
  # used by OpenAPI → TS pipeline (F0.7); install in CI/node side primarily
]
all = ["econojin[worker,dev]"]

[project.urls]
Repository = "https://github.com/mahak1988/eco-nojin"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "security*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "S"]
ignore = ["S101", "ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warm_return_any = true
warm_unused_configs = true
check_untyped_defs = true
strict_optional = true

[tool.coverage.run]
source = ["apps"]
omit = ["*/tests/*", "*/migrations/*", "alembic/*"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]
