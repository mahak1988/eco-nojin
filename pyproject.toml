[project]
name = "econojin"
version = "2.0.0"
description = "Scientific platform for ecological modeling, carbon tracking, and smart agriculture"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Econojin Team", email = "team@econojin.com" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["agriculture", "ecology", "carbon", "iot", "smart-farming"]

# ============================================================
# Dependencies - Backend Core
# ============================================================
dependencies = [
    # FastAPI & Web Framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    
    # Database - PostgreSQL + Async
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",  # For development/testing
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    
    # Pydantic v2
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "pydantic-extra-types>=2.8.0,<3.0.0",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "cryptography>=42.0.0,<43.0.0",
    
    # Redis & Caching
    "redis>=5.0.0,<6.0.0",
    
    # Celery - Background Tasks
    "celery>=5.4.0,<6.0.0",
    "flower>=2.0.0,<3.0.0",
    
    # WebSocket
    "websockets>=12.0,<13.0",
    
    # Logging & Monitoring
    "structlog>=24.0.0,<25.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
    
    # Validation & Sanitization
    "email-validator>=2.2.0,<3.0.0",
    "phonenumbers>=8.13.0,<9.0.0",
    
    # Geo & Spatial
    "geojson>=3.1.0,<4.0.0",
    "shapely>=2.0.0,<3.0.0",
    
    # Data Processing
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    
    # HTTP Client
    "requests>=2.32.0,<3.0.0",
    
    # Environment
    "python-dotenv>=1.0.0,<2.0.0",
    
    # Utilities
    "tenacity>=8.3.0,<9.0.0",
    "arrow>=1.3.0,<2.0.0",
]

# ============================================================
# Optional Dependencies - AI & ML
# ============================================================
[project.optional-dependencies]
ai = [
    "langgraph>=0.0.40",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.2.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

simulation = [
    "scipy>=1.13.0,<2.0.0",
    "xarray>=2024.0.0",
    "netcdf4>=1.6.0,<2.0.0",
    "cftime>=1.6.0,<2.0.0",
]

satellite = [
    "sentinelhub>=3.11.0,<4.0.0",
    "rasterio>=1.3.0,<2.0.0",
    "gdal>=3.8.0",
]

dev = [
    # Testing
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=25.0.0,<26.0.0",
    
    # Code Quality
    "black>=24.4.0,<25.0.0",
    "ruff>=0.4.0,<1.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    
    # Debugging
    "ipdb>=0.13.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    
    # API Testing
    "schemathesis>=3.20.0,<4.0.0",
]

docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocstrings[python]>=0.25.0,<1.0.0",
    "mkdocs-awesome-pages-plugin>=2.9.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "core*"]
exclude = ["tests*", "*.tests*"]

# ============================================================
# Tool Configurations
# ============================================================

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", ".venv", "venv"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["apps", "core"]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific rules
    "FAST", # fastapi best practices
]
ignore = [
    "S101",   # assert statements (needed for tests)
    "ARG001", # unused function arguments (common in FastAPI)
    "ARG002", # unused method arguments
    "B008",   # function calls in argument defaults (needed for Depends)
    "N805",   # first argument of method should be named self
    "N806",   # variable in function should be lowercase
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # unused imports
"tests/*" = ["S101", "S106", "S108"]  # security rules not needed in tests
"alembic/*" = ["E501"]  # line length in migrations

[tool.pytest.ini_options]
testpaths = ["apps", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-ra",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=70",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "aiosqlite.*",
    "passlib.*",
    "jose.*",
    "geojson.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["apps", "core"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/conftest.py",
    "apps/main.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "scripts", "migrations"]
skips = ["B101"]  # allow assert in tests
targets = ["apps"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
tag_format = "v$version"
update_changelog_on_bump = true
