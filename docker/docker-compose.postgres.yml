# =============================================================================
# Docker Compose - PostgreSQL 16 + PostGIS 3.4 + pgAdmin 4
# For local development and production PostgreSQL deployments
# =============================================================================

version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: econojin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: econojin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-econojin_dev}
      POSTGRES_DB: econojin
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econojin -d econojin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - econojin-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: econojin-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@econojin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - econojin-network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
    name: econojin_postgres_data
  pgadmin_data:
    name: econojin_pgadmin_data

networks:
  econojin-network:
    name: econojin-network
    driver: bridge
