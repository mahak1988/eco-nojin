# Phase 6 — minimal free local stack (API only; no paid services)
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: sqlite+aiosqlite:///./apps/econojin.db
      SECRET_KEY: local-dev-only-change-me-use-secrets-token-urlsafe-48
      REQUIRE_AUTH_FOR_WRITES: "false"
      ENABLE_SPIDERGUARD: "false"
    command: >
      bash -c "pip install -q -r requirements.txt &&
      python -m uvicorn apps.main:app --host 0.0.0.0 --port 8000"
