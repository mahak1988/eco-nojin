# =============================================================================
# Docker Compose - Production Deployment
# Full stack: PostgreSQL + Redis + Celery + Nginx + Monitoring
# =============================================================================

version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # =========================================================================
  # PostgreSQL 16 + PostGIS
  # =========================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: econojin-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-econojin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:-econojin}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-econojin} -d ${POSTGRES_DB:-econojin}"]
      <<: *healthcheck-defaults
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

  # =========================================================================
  # Redis 7 (with persistence)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: econojin-redis-prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2560M
        reservations:
          cpus: "0.25"
          memory: 256M

  # =========================================================================
  # FastAPI Backend
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: econojin-api-prod
    restart: always
    command: >
      uvicorn apps.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${API_WORKERS:-4}
      --proxy-headers
      --forwarded-allow-ips '*'
      --limit-concurrency 200
      --backlog 2048
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-econojin}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-econojin}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
      COOKIE_SECURE: "true"
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # =========================================================================
  # Celery Worker
  # =========================================================================
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: econojin-celery-worker-prod
    restart: always
    command: >
      celery -A apps.shared_core.celery_app.celery_app worker
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=100
      --prefetch-multiplier=1
      --without-gossip
      --without-mingle
      --without-heartbeat
      -O fair
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-econojin}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-econojin}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-}@redis:6379/2
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.shared_core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # =========================================================================
  # Celery Beat (Scheduler)
  # =========================================================================
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: econojin-celery-beat-prod
    restart: always
    command: >
      celery -A apps.shared_core.celery_app.celery_app beat
      --loglevel=${CELERY_LOG_LEVEL:-info}
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      ENVIRONMENT: production
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/1
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.shared_core.celery_app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend
    logging: *default-logging

  # =========================================================================
  # Nginx Reverse Proxy
  # =========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: econojin-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ./secrets/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # =========================================================================
  # Prometheus Metrics
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.47
    container_name: econojin-prometheus-prod
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - backend
    logging: *default-logging

  # =========================================================================
  # Grafana Dashboards
  # =========================================================================
  grafana:
    image: grafana/grafana:10.2
    container_name: econojin-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?err}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      <<: *healthcheck-defaults
    networks:
      - backend
    logging: *default-logging

  # =========================================================================
  # pgAdmin (optional — can be disabled in production)
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: econojin-pgadmin-prod
    restart: unless-stopped
    profiles: ["management"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@econojin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?err}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: econojin-net
    ipam:
      config:
        - subnet: 172.28.0.0/16
