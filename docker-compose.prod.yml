version: '3.8'
services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [db, redis]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/econojin
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production

  celery:
    build: .
    command: celery -A apps.shared_core.celery_app.celery_app worker --loglevel=info
    depends_on: [db, redis]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/econojin
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: econojin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
